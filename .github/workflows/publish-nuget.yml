name: Publish NuGet Packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  NUGET_OUTPUT: ${{ github.workspace }}/artifacts/nuget
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    name: Build, validate, and publish NuGet packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        id: setup-dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Pin workflow .NET SDK
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f global.json ]]; then
            printf '{"sdk":{"version":"%s","rollForward":"latestFeature"}}\n' '${{ steps.setup-dotnet.outputs.dotnet-version }}' > global.json
          fi

      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = "Stop"
          . ./.assets/scripts/utilities.ps1

          $plan = Resolve-ReleasePlan -Tag $Env:RELEASE_TAG
          $repositoryTags = @(& git tag --list)
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to enumerate repository tags."
          }
          Assert-NoReleaseTagCollision `
            -ReleasePlan $plan `
            -CurrentTag $Env:RELEASE_TAG `
            -RepositoryTags $repositoryTags

          $artifactKey = switch ($plan.PackageFamily) {
            "All" { "all" }
            "SwiftCollections" { "swiftcollections" }
            "SwiftCollections.FixedMathSharp" { "swiftcollections-fixedmathsharp" }
          }

          "package_family=$($plan.PackageFamily)" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8
          "package_version=$($plan.Version)" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_key=$artifactKey" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8
          "PACKAGE_FAMILY=$($plan.PackageFamily)" | Out-File -FilePath $Env:GITHUB_ENV -Append -Encoding utf8
          "PACKAGE_VERSION=$($plan.Version)" | Out-File -FilePath $Env:GITHUB_ENV -Append -Encoding utf8
          "ASSEMBLY_VERSION=$($plan.Version).0" | Out-File -FilePath $Env:GITHUB_ENV -Append -Encoding utf8
          "FILE_VERSION=$($plan.Version).0" | Out-File -FilePath $Env:GITHUB_ENV -Append -Encoding utf8
          "INFORMATIONAL_VERSION=$($plan.Version)+$Env:GITHUB_SHA" | Out-File -FilePath $Env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Release family: $($plan.PackageFamily)"
          Write-Host "Release version: $($plan.Version)"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Prepare package output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$NUGET_OUTPUT"
          mkdir -p "$NUGET_OUTPUT"

      - name: Build and test release configurations
        shell: bash
        run: |
          set -euo pipefail

          version_args=(
            "-p:GitVersion_FullSemVer=$PACKAGE_VERSION"
            "-p:GitVersion_AssemblySemVer=$ASSEMBLY_VERSION"
            "-p:GitVersion_AssemblySemFileVer=$FILE_VERSION"
            "-p:GitVersion_InformationalVersion=$INFORMATIONAL_VERSION"
            "-p:GeneratePackageOnBuild=false"
          )

          test_args=()
          if [[ "$PACKAGE_FAMILY" == "SwiftCollections.FixedMathSharp" ]]; then
            test_args=("-p:UsePublishedSwiftCollections=true")
          fi

          for configuration in Release ReleaseLean; do
            dotnet build SwiftCollections.slnx \
              --configuration "$configuration" \
              "${version_args[@]}" \
              "${test_args[@]}"

            dotnet test SwiftCollections.slnx \
              --configuration "$configuration" \
              --no-build \
              --verbosity normal \
              "${version_args[@]}" \
              "${test_args[@]}"
          done

      - name: Pack selected package family
        shell: bash
        run: |
          set -euo pipefail

          case "$PACKAGE_FAMILY" in
            "All")
              projects=(
                "src/SwiftCollections/SwiftCollections.csproj"
                "src/SwiftCollections.FixedMathSharp/SwiftCollections.FixedMathSharp.csproj"
              )
              release_args=()
              ;;
            "SwiftCollections")
              projects=("src/SwiftCollections/SwiftCollections.csproj")
              release_args=()
              ;;
            "SwiftCollections.FixedMathSharp")
              projects=("src/SwiftCollections.FixedMathSharp/SwiftCollections.FixedMathSharp.csproj")
              release_args=("-p:UsePublishedSwiftCollections=true")
              ;;
            *)
              echo "::error::Unsupported package family: $PACKAGE_FAMILY"
              exit 1
              ;;
          esac

          version_args=(
            "-p:GitVersion_FullSemVer=$PACKAGE_VERSION"
            "-p:GitVersion_AssemblySemVer=$ASSEMBLY_VERSION"
            "-p:GitVersion_AssemblySemFileVer=$FILE_VERSION"
            "-p:GitVersion_InformationalVersion=$INFORMATIONAL_VERSION"
            "-p:GeneratePackageOnBuild=false"
          )

          for configuration in Release ReleaseLean; do
            for project in "${projects[@]}"; do
              dotnet build "$project" \
                --configuration "$configuration" \
                "${version_args[@]}" \
                "${release_args[@]}"

              dotnet pack "$project" \
                --configuration "$configuration" \
                --no-build \
                --no-restore \
                "${version_args[@]}" \
                "${release_args[@]}" \
                -p:PackageOutputPath="$NUGET_OUTPUT"
            done
          done

      - name: Validate package artifacts and metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $expectedIds = switch ($Env:PACKAGE_FAMILY) {
            "All" {
              @(
                "SwiftCollections"
                "SwiftCollections.Lean"
                "SwiftCollections.FixedMathSharp"
                "SwiftCollections.FixedMathSharp.Lean"
              )
            }
            "SwiftCollections" { @("SwiftCollections", "SwiftCollections.Lean") }
            "SwiftCollections.FixedMathSharp" {
              @("SwiftCollections.FixedMathSharp", "SwiftCollections.FixedMathSharp.Lean")
            }
            default { throw "Unsupported package family: $Env:PACKAGE_FAMILY" }
          }

          $expectedFiles = @(
            foreach ($expectedId in $expectedIds) {
              "$expectedId.$Env:PACKAGE_VERSION.nupkg"
              "$expectedId.$Env:PACKAGE_VERSION.snupkg"
            }
          )
          $actualFiles = @(
            Get-ChildItem -LiteralPath $Env:NUGET_OUTPUT -File |
              Where-Object { $_.Extension -in @(".nupkg", ".snupkg") } |
              ForEach-Object Name
          )
          $missingFiles = @($expectedFiles | Where-Object { $actualFiles -cnotcontains $_ })
          $unexpectedFiles = @($actualFiles | Where-Object { $expectedFiles -cnotcontains $_ })
          if ($missingFiles.Count -ne 0 -or $unexpectedFiles.Count -ne 0) {
            throw "Package artifact set mismatch. Missing: $($missingFiles -join ', '). Unexpected: $($unexpectedFiles -join ', ')."
          }

          Write-Host "Validated package artifacts:"
          $actualFiles | Sort-Object | ForEach-Object { Write-Host "  $_" }

          [xml]$companionProject = Get-Content -Raw -LiteralPath "src/SwiftCollections.FixedMathSharp/SwiftCollections.FixedMathSharp.csproj"
          $coreVersionNode = @($companionProject.Project.PropertyGroup.SwiftCollectionsPackageVersion)[0]
          $expectedCoreVersion = if ($Env:PACKAGE_FAMILY -ceq "All") {
            $Env:PACKAGE_VERSION
          } else {
            $coreVersionNode.InnerText
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($expectedId in $expectedIds) {
            $packagePath = Join-Path $Env:NUGET_OUTPUT "$expectedId.$Env:PACKAGE_VERSION.nupkg"
            $archive = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
            try {
              $nuspecEntries = @($archive.Entries | Where-Object { $_.FullName -like "*.nuspec" })
              if ($nuspecEntries.Count -ne 1) {
                throw "Expected one nuspec in $packagePath, found $($nuspecEntries.Count)."
              }

              $reader = [System.IO.StreamReader]::new($nuspecEntries[0].Open())
              try {
                [xml]$nuspec = $reader.ReadToEnd()
              } finally {
                $reader.Dispose()
              }
            } finally {
              $archive.Dispose()
            }

            $namespace = [System.Xml.XmlNamespaceManager]::new($nuspec.NameTable)
            $namespace.AddNamespace("n", $nuspec.DocumentElement.NamespaceURI)
            $metadata = $nuspec.SelectSingleNode("/n:package/n:metadata", $namespace)
            $actualId = $metadata.SelectSingleNode("n:id", $namespace).InnerText
            $actualVersion = $metadata.SelectSingleNode("n:version", $namespace).InnerText
            if ($actualId -cne $expectedId -or $actualVersion -cne $Env:PACKAGE_VERSION) {
              throw "Package metadata mismatch in ${packagePath}: $actualId $actualVersion."
            }

            if ($expectedId -like "SwiftCollections.FixedMathSharp*") {
              $isLean = $expectedId.EndsWith(".Lean", [System.StringComparison]::Ordinal)
              $expectedCoreId = if ($isLean) {
                "SwiftCollections.Lean"
              } else {
                "SwiftCollections"
              }
              $expectedFixedMathId = if ($isLean) {
                "FixedMathSharp.Lean"
              } else {
                "FixedMathSharp"
              }
              $fixedMathReference = @(
                $companionProject.SelectNodes("//PackageReference") |
                  Where-Object { $_.GetAttribute("Include") -ceq $expectedFixedMathId }
              )
              if ($fixedMathReference.Count -ne 1) {
                throw "Expected one $expectedFixedMathId reference in the companion project."
              }

              $expectedDependencies = @(
                [pscustomobject]@{ Id = $expectedCoreId; Version = $expectedCoreVersion }
                [pscustomobject]@{
                  Id = $expectedFixedMathId
                  Version = $fixedMathReference[0].GetAttribute("Version")
                }
              )

              $groups = @($metadata.SelectNodes("n:dependencies/n:group", $namespace))
              if ($groups.Count -ne 2) {
                throw "Expected two target-framework dependency groups in $expectedId, found $($groups.Count)."
              }

              $expectedFrameworks = @("net8.0", ".NETStandard2.1")
              $actualFrameworks = @($groups | ForEach-Object { $_.GetAttribute("targetFramework") })
              $missingFrameworks = @($expectedFrameworks | Where-Object { $actualFrameworks -cnotcontains $_ })
              $unexpectedFrameworks = @($actualFrameworks | Where-Object { $expectedFrameworks -cnotcontains $_ })
              if ($missingFrameworks.Count -ne 0 -or $unexpectedFrameworks.Count -ne 0) {
                throw "Unexpected target frameworks in ${expectedId}. Missing: $($missingFrameworks -join ', '). Unexpected: $($unexpectedFrameworks -join ', ')."
              }

              foreach ($group in $groups) {
                $actualDependencies = @($group.SelectNodes("n:dependency", $namespace))
                if ($actualDependencies.Count -ne $expectedDependencies.Count) {
                  throw "Expected $($expectedDependencies.Count) dependencies in $expectedId $($group.GetAttribute('targetFramework')), found $($actualDependencies.Count)."
                }

                foreach ($expectedDependency in $expectedDependencies) {
                  $matches = @(
                    $actualDependencies |
                      Where-Object {
                        $_.GetAttribute("id") -ceq $expectedDependency.Id -and
                        $_.GetAttribute("version") -ceq $expectedDependency.Version
                      }
                  )
                  if ($matches.Count -ne 1) {
                    throw "Expected dependency $($expectedDependency.Id) $($expectedDependency.Version) in $expectedId $($group.GetAttribute('targetFramework'))."
                  }
                }
              }
            }
          }

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ steps.release.outputs.artifact_key }}-${{ steps.release.outputs.package_version }}
          path: ${{ env.NUGET_OUTPUT }}/*
          if-no-files-found: error

      - name: Publish packages to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "::error::NUGET_API_KEY secret is not configured."
            exit 1
          fi

          cd "$NUGET_OUTPUT"

          dotnet nuget push "*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source "$NUGET_SOURCE" \
            --skip-duplicate
